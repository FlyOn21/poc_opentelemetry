# OpenTelemetry Collector — конфігурація
# Приймає OTLP дані від FastAPI і маршрутизує:
#   traces  → Tempo (OTLP/HTTP)
#   metrics → Prometheus (Remote Write)
#   logs    → Loki (OTLP native endpoint)

receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 200
    spike_limit_mib: 50
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  # Traces → Tempo
  otlphttp/tempo:
    endpoint: http://tempo:4318

  # Metrics → Prometheus (Remote Write)
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

  # Logs → Loki (native OTLP endpoint)
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
  telemetry:
    logs:
      level: info
